name: Supabase Database Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f roles.sql \
            --role-only

      - name: Dump schema
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f schema.sql

      - name: Dump data
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f data.sql \
            --data-only \
            --use-copy

      - name: Upload backup files
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: |
            roles.sql
            schema.sql
            data.sql
          retention-days: 30
